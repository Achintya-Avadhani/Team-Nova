spring:
  application:
    name: secure-auth-resilience

server:
  address: 0.0.0.0
  port: 8080

resilience4j:
  circuitbreaker:
    instances:
      loginService:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 5
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 2

login:
  rate-limit:
    user-limit: 20
    ip-limit: 20
    refresh-period-seconds: 60

logging:
  level:
    root: INFO
    com.hdfc.secureauth: INFO